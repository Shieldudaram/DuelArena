name: ciCheck

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ciCheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep workflow and job names stable so branch protection can require this check context.
  ciCheck:
    name: ciCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run CI checks
        run: ./gradlew -Prequire_hytale=false ciCheck test --no-daemon
